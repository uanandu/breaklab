apiVersion: v1
kind: Pod
metadata:
  name: notes-writer
  labels:
    app: notes-writer
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: notes
          mountPath: /notes
  volumes:
    - name: notes
      persistentVolumeClaim:
        claimName: notes-pvc
