apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-worker
  labels:
    app: flaky-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaky-worker
  template:
    metadata:
      labels:
        app: flaky-worker
    spec:
      containers:
        - name: flaky-worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              count_file=/data/count
              n=$(cat "$count_file" 2>/dev/null || echo 0)
              n=$((n+1))
              echo "$n" > "$count_file"
              if [ "$n" -le 2 ]; then
                echo "boom: dependency not ready (attempt $n)"
                exit 1
              fi
              echo "started cleanly on attempt $n"
              sleep 3600
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
