apiVersion: apps/v1
kind: Deployment
metadata:
  name: configwatcher
  labels:
    app: configwatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configwatcher
  template:
    metadata:
      labels:
        app: configwatcher
    spec:
      containers:
        - name: configwatcher
          image: busybox:1.36
          command: ["sh", "-c", "cat /etc/config/mode > /tmp/status && sleep infinity"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
      volumes:
        - name: config
          configMap:
            name: site-config
