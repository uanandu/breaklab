apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              touch /tmp/ready
              while true; do
                if wget -q -T 2 -O- http://cache:6379/ >/dev/null 2>&1; then echo "cache: ok"; else echo "cache: unreachable"; fi
                if wget -q -T 2 -O- http://backend:5432/ >/dev/null 2>&1; then echo "backend: ok"; else echo "backend: unreachable"; fi
                sleep 2
              done
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
