apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels:
    app: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
        tier: backend
    spec:
      containers:
        - name: reports
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: reports
spec:
  selector:
    app: reports-old
  ports:
    - port: 80
      targetPort: 8080
