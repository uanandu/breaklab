apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: {{ .Values.service.port }}
      # BUG: hardcoded instead of referencing .Values.containerPort --
      # the container actually listens on port 80, not 8080.
      targetPort: 8080
