apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          env:
            - name: REQUIRED_TOKEN
              value: "abc123"
          command:
            - sh
            - -c
            - |
              if [ -z "$REQUIRED_TOKEN" ]; then
                echo "missing REQUIRED_TOKEN" >&2
                exit 1
              fi
              touch /tmp/ready && sleep infinity
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 1
            periodSeconds: 2
